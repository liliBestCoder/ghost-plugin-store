<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgF1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161326" />
      <stop offset="100%" stop-color="#07080c" />
    </radialGradient>
    <linearGradient id="purpleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <radialGradient id="flatFlesh" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#fdf4ff" />
      <stop offset="95%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </radialGradient>
    <linearGradient id="glowCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadowF1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#581c87" flood-opacity="0.4" />
    </filter>
    <filter id="coreNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgF1)" stroke="#222533" stroke-width="2" />

  <g transform="translate(0, -6)" filter="url(#shadowF1)">
    <!-- 1. 下层平切茄片 (Bottom Flat Eggplant Slice) -->
    <g transform="translate(256, 316) rotate(2) translate(-256, -316)">
      <!-- 侧边深紫茄皮厚度 (Flat cylinder edge, 24px) -->
      <path d="M 126 316 C 126 360, 386 360, 386 316 L 386 340 C 386 384, 126 384, 126 340 Z" fill="#200538" />
      <path d="M 126 316 C 126 360, 386 360, 386 316 L 386 332 C 386 376, 126 376, 126 332 Z" fill="url(#purpleRim)" />
      <!-- 平切表面 (Flat cut face) -->
      <ellipse cx="256" cy="316" rx="130" ry="44" fill="url(#purpleRim)" stroke="#a855f7" stroke-width="2" />
      <ellipse cx="256" cy="314" rx="118" ry="36" fill="url(#flatFlesh)" />
      <ellipse cx="256" cy="314" rx="66" ry="18" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="3 9" opacity="0.6" />
    </g>

    <!-- 2. 中间夹心层 (Filling sandwiched between the two flat slices) -->
    <g filter="url(#coreNeon)">
      <path d="M 148 260 
               C 175 240, 335 244, 364 266 
               C 342 290, 170 286, 148 260 Z" 
            fill="url(#glowCore)" opacity="0.9" />
      <!-- High-tech data wave in filling -->
      <path d="M 175 264 Q 215 246, 256 264 T 337 266" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="256" cy="264" r="5" fill="#a5f3fc" />
    </g>

    <!-- 3. 上层平切茄片 (Top Flat Eggplant Slice - 完全平整的切片，绝非汉堡包圆顶) -->
    <g transform="translate(256, 212) rotate(-6) translate(-256, -212)">
      <!-- 侧边深紫茄皮厚度 (Flat cylinder edge, 24px) -->
      <path d="M 126 212 C 126 256, 386 256, 386 212 L 386 236 C 386 280, 126 280, 126 236 Z" fill="#200538" />
      <path d="M 126 212 C 126 256, 386 256, 386 212 L 386 228 C 386 272, 126 272, 126 228 Z" fill="url(#purpleRim)" />
      
      <!-- 顶面：平整切面！紫皮边缘圈 + 白嫩茄肉 + 茄籽环 -->
      <ellipse cx="256" cy="212" rx="130" ry="44" fill="url(#purpleRim)" stroke="#d8b4fe" stroke-width="2.5" />
      <ellipse cx="256" cy="210" rx="118" ry="36" fill="url(#flatFlesh)" />
      <ellipse cx="256" cy="210" rx="66" ry="18" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="3 9" opacity="0.6" />

      <!-- Minimalist green calyx leaf accent on the rim -->
      <path d="M 325 178 C 345 160, 370 152, 390 160 C 375 172, 352 182, 332 185 Z" fill="#22c55e" />
    </g>

    <!-- 4. 连刀皮 (Left Hinge - 连刀处的紫色茄皮) -->
    <path d="M 128 218 C 110 256, 110 274, 128 322" 
          fill="none" 
          stroke="url(#purpleRim)" 
          stroke-width="18" 
          stroke-linecap="round" />
  </g>
</svg>