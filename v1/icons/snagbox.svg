<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="20%" cy="16%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#sheen)"/>

  <g transform="translate(2, 1)">
    <!-- Left curved hinge aligned seamlessly to both slice tips -->
    <path d="M 65 103 C 42 124, 42 148, 65 170"
          fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>

    <!-- Bottom flat eggplant slice -->
    <g transform="translate(132, 174) rotate(3) translate(-132, -174)">
      <ellipse cx="132" cy="174" rx="73" ry="25" fill="#ffffff" fill-opacity="0.96"/>
      <ellipse cx="132" cy="174" rx="43" ry="10.5" fill="none" stroke="#7c3aed" stroke-width="5" stroke-opacity="0.32"/>
    </g>

    <!-- Middle data-capture wave filling -->
    <path d="M 80 135 Q 108 119, 136 135 T 192 135"
          fill="none" stroke="url(#waveFill)" stroke-width="13" stroke-linecap="round"/>

    <!-- Top flat eggplant slice (angled open) -->
    <g transform="translate(132, 92) rotate(-8) translate(-132, -92)">
      <ellipse cx="132" cy="92" rx="73" ry="25" fill="#ffffff"/>
      <ellipse cx="132" cy="92" rx="43" ry="10.5" fill="none" stroke="#7c3aed" stroke-width="5" stroke-opacity="0.32"/>
      <!-- Crisp green calyx leaf accent -->
      <path d="M 164 68 C 176 52, 198 48, 210 55 C 198 67, 180 74, 166 75 Z" fill="#4ade80"/>
    </g>
  </g>
</svg>
